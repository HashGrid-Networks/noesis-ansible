---
# Later-approved apply playbook. Default extra-vars keep mutation gated off.
# Physical hostname is not part of this playbook; bind it only at approval time
# via inventory/prodqual_loopback_fixture/BINDING-CONTRACT.md.
#
# This playbook is not wired into site.yml or master-stack.yml.
# Identity/filesystem/activation/backup/restore/rollback require explicit
# extra-vars AND effective root (become). Offline validation uses a
# structurally different tasks_from and cannot reach those files.

- name: Prepare macOS prodqual loopback target (gated)
  hosts: prodqual_loopback
  gather_facts: false
  become: false
  tags: [prodqual]
  vars:
    prodqual_offline_mode: false
    prodqual_privilege_required: true
  pre_tasks:
    - name: Refuse default apply
      ansible.builtin.assert:
        that:
          - prodqual_apply_authorized | bool
        fail_msg: >-
          macos-prodqual-loopback.yml will not mutate a host unless
          -e prodqual_apply_authorized=true is explicitly supplied after
          independent review. Identity, filesystem, and activation remain
          separately gated. System identity, LaunchDaemons, and launchctl
          system domain require effective root.
      tags: [always]

    - name: Gather facts only after apply authorization
      become: true
      ansible.builtin.setup:
      when: prodqual_apply_authorized | bool
      tags: [always]
  roles:
    - role: macos_prodqual_loopback
