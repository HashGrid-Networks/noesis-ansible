---
# Offline validation only. Does not create users, change permissions,
# install payload, load launchd, access credentials, or bind a physical host.
#
#   ansible-playbook -i inventory/prodqual_loopback_fixture/hosts.ini \
#     playbooks/macos-prodqual-loopback-validate.yml --syntax-check
#   ansible-playbook -i inventory/prodqual_loopback_fixture/hosts.ini \
#     playbooks/macos-prodqual-loopback-validate.yml --check
#
# Do not pass --tags activate or identity. This playbook does not import those phases.

- name: Offline-validate macOS prodqual loopback target
  hosts: prodqual_loopback
  gather_facts: false
  become: false
  tags: [prodqual, offline, validate]
  vars:
    prodqual_offline_mode: true
    prodqual_apply_authorized: false
    prodqual_activation_authorized: false
    prodqual_canary_authorized: false
    prodqual_restore_authorized: false
  roles:
    - role: macos_prodqual_loopback
      tags: [prodqual, offline, validate]
