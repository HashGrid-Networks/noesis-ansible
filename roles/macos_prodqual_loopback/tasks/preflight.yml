---
- name: Refuse apply during offline validation
  ansible.builtin.assert:
    that:
      - not (prodqual_apply_authorized | bool and prodqual_offline_mode | bool)
    fail_msg: "prodqual_apply_authorized cannot be combined with prodqual_offline_mode"

- name: Refuse plaintext secret variables
  ansible.builtin.assert:
    that:
      - vault_tailscale_auth_key is not defined
      - hermes_broker_token is not defined
      - HERMES_BROKER_TOKEN is not defined
      - bws_access_token is not defined
      - ansible_become_pass is not defined
    fail_msg: "plaintext secret-bearing variables are forbidden in this target"

- name: Build fail-closed policy config
  ansible.builtin.set_fact:
    prodqual_config:
      target_name: "{{ prodqual_target_name }}"
      target_version: "{{ prodqual_target_version }}"
      os_family: "{{ prodqual_os_family }}"
      os_product: "{{ prodqual_os_product }}"
      os_major: "{{ prodqual_os_major }}"
      arch: "{{ prodqual_arch }}"
      authority_user: "{{ prodqual_authority_user }}"
      worker_user: "{{ prodqual_worker_user }}"
      authority_group: "{{ prodqual_authority_group }}"
      worker_group: "{{ prodqual_worker_group }}"
      authority_uid: "{{ prodqual_authority_uid }}"
      worker_uid: "{{ prodqual_worker_uid }}"
      operator_uid: "{{ prodqual_operator_uid }}"
      tailscale_bind_enabled: "{{ prodqual_tailscale_bind_enabled | bool }}"
      public_bind_enabled: "{{ prodqual_public_bind_enabled | bool }}"
      allowed_path_prefixes: "{{ prodqual_allowed_path_prefixes | default([prodqual_path_prefix, prodqual_authority_launchd_dir]) }}"
      runtime_root: "{{ prodqual_runtime_root }}"
      manifest_path: "{{ prodqual_manifest_path }}"
      taskstore_root: "{{ prodqual_taskstore_root }}"
      approval_store: "{{ prodqual_approval_store }}"
      backup_root: "{{ prodqual_backup_root }}"
      authority_profile_root: "{{ prodqual_authority_profile_root }}"
      worker_profile_root: "{{ prodqual_worker_profile_root }}"
      worker_scratch_root: "{{ prodqual_worker_scratch_root }}"
      authority_credential_ref_root: "{{ prodqual_authority_credential_ref_root }}"
      authority_log_root: "{{ prodqual_authority_log_root }}"
      worker_log_root: "{{ prodqual_worker_log_root }}"
      authority_run_root: "{{ prodqual_authority_run_root }}"
      authority_launchd_dir: "{{ prodqual_authority_launchd_dir }}"
      worker_launchd_dir: "{{ prodqual_worker_launchd_dir }}"
      rollback_staging_root: "{{ prodqual_rollback_staging_root }}"
      taskstore_dir_mode: "{{ prodqual_taskstore_dir_mode }}"
      taskstore_file_mode: "{{ prodqual_taskstore_file_mode }}"
      approval_dir_mode: "{{ prodqual_approval_dir_mode }}"
      approval_file_mode: "{{ prodqual_approval_file_mode }}"
      backup_dir_mode: "{{ prodqual_backup_dir_mode }}"
      credential_ref_dir_mode: "{{ prodqual_credential_ref_dir_mode }}"
      authority_profile_dir_mode: "{{ prodqual_authority_profile_dir_mode }}"
      worker_profile_dir_mode: "{{ prodqual_worker_profile_dir_mode }}"
      runtime_dir_mode: "{{ prodqual_runtime_dir_mode }}"
      runtime_file_mode: "{{ prodqual_runtime_file_mode }}"
      runtime_owner: "{{ prodqual_runtime_owner }}"
      manifest_owner: "{{ prodqual_manifest_owner }}"
      worker_profile_owner: "{{ prodqual_worker_profile_owner }}"
      binds:
        broker:
          host: "{{ prodqual_broker_bind_host }}"
          port: "{{ prodqual_broker_bind_port }}"
        openclaw:
          host: "{{ prodqual_openclaw_bind_host }}"
          port: "{{ prodqual_openclaw_bind_port }}"
      service_labels: "{{ prodqual_service_labels }}"
      governed_env_keys: "{{ prodqual_governed_env_keys }}"
      runtime_payload_recipe_version: "{{ prodqual_runtime_payload_recipe_version }}"
      manifest_schema_version: "{{ prodqual_manifest_schema_version }}"
      runtime_files: "{{ prodqual_runtime_files }}"
      runtime_payload_digest: "{{ prodqual_runtime_payload_digest }}"
      hardening_candidate_commit: "{{ prodqual_hardening_candidate_commit }}"
      ansible_baseline_commit: "{{ prodqual_ansible_baseline_commit }}"
      agent_stack_commit: "{{ prodqual_agent_stack_commit }}"
      lease_candidate_commit: "{{ prodqual_lease_candidate_commit }}"
      lease_candidate_status: "{{ prodqual_lease_candidate_status }}"
      timeout_seconds: "{{ prodqual_timeout_seconds }}"
      exit_timeout_seconds: "{{ prodqual_exit_timeout_seconds }}"
      throttle_interval_seconds: "{{ prodqual_throttle_interval_seconds }}"
      max_parallel_jobs: "{{ prodqual_max_parallel_jobs }}"
      max_fanout: "{{ prodqual_max_fanout }}"
      apply_authorized: "{{ prodqual_apply_authorized | bool }}"
      offline_mode: "{{ prodqual_offline_mode | bool }}"

- name: Fail closed on target policy violations
  ansible.builtin.assert:
    that:
      - (prodqual_config | prodqual_policy_errors | length) == 0
    fail_msg: "{{ prodqual_config | prodqual_policy_errors | join('; ') }}"

- name: Refuse stale launchd labels in this target
  ansible.builtin.assert:
    that:
      - item not in prodqual_stale_labels_refused
      - not (item | regex_search('^com\\.noesis\\.'))
    fail_msg: "stale launchd label refused: {{ item }}"
  loop: "{{ prodqual_service_labels }}"

- name: Refuse non-loopback or Tailscale binds
  ansible.builtin.assert:
    that:
      - prodqual_broker_bind_host in ['127.0.0.1', '::1']
      - prodqual_openclaw_bind_host in ['127.0.0.1', '::1']
      - not (prodqual_tailscale_bind_enabled | bool)
      - not (prodqual_public_bind_enabled | bool)
      - prodqual_hermes_gateway_bind_class == 'unix_socket'
    fail_msg: "this target is loopback-only; Tailscale and public binds are prohibited"

- name: Live OS preflight (skipped offline)
  when: not (prodqual_offline_mode | bool)
  block:
    - name: Require Darwin facts
      ansible.builtin.assert:
        that:
          - ansible_os_family | default('') == 'Darwin'
          - ansible_architecture | default('') == 'arm64' or ansible_machine | default('') == 'arm64'
          - (ansible_distribution_version | default('0')).split('.')[0] == prodqual_os_major
        fail_msg: >-
          live host is not Darwin/macOS major {{ prodqual_os_major }} arm64
          (os_family={{ ansible_os_family | default('unset') }},
          arch={{ ansible_architecture | default('unset') }},
          version={{ ansible_distribution_version | default('unset') }})
