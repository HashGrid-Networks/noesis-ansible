---
# Later-approved filesystem boundary. Never run in offline validation.
# Worker probes use Darwin python setuid, not Linux su with a shell flag.

- name: Require apply authorization for filesystem mutation
  ansible.builtin.assert:
    that:
      - prodqual_apply_authorized | bool
      - not (prodqual_offline_mode | bool)
      - prodqual_authority_uid | int > 0
      - prodqual_worker_uid | int > 0
      - prodqual_worker_gid | int > 0
    fail_msg: "filesystem tasks are apply-gated and require discovered UIDs"

- name: Require effective root for filesystem mutation
  become: true
  ansible.builtin.assert:
    that:
      - ansible_effective_user_id | int == 0
    fail_msg: "filesystem mutation requires effective root/become"

- name: Create authority-owned path classes
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ prodqual_authority_user }}"
    group: "{{ prodqual_authority_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prodqual_runtime_root }}"
      mode: "{{ prodqual_runtime_dir_mode }}"
    - path: "{{ prodqual_manifest_path | dirname }}"
      mode: "{{ prodqual_approval_dir_mode }}"
    - path: "{{ prodqual_taskstore_root }}"
      mode: "{{ prodqual_taskstore_dir_mode }}"
    - path: "{{ prodqual_approval_store }}"
      mode: "{{ prodqual_approval_dir_mode }}"
    - path: "{{ prodqual_backup_root }}"
      mode: "{{ prodqual_backup_dir_mode }}"
    - path: "{{ prodqual_authority_profile_root }}"
      mode: "{{ prodqual_authority_profile_dir_mode }}"
    - path: "{{ prodqual_authority_credential_ref_root }}"
      mode: "{{ prodqual_credential_ref_dir_mode }}"
    - path: "{{ prodqual_authority_log_root }}"
      mode: "{{ prodqual_log_dir_mode }}"
    - path: "{{ prodqual_authority_run_root }}"
      mode: "{{ prodqual_log_dir_mode }}"
    - path: "{{ prodqual_rollback_staging_root }}"
      mode: "{{ prodqual_backup_dir_mode }}"

- name: Create worker-owned bounded path classes
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ prodqual_worker_user }}"
    group: "{{ prodqual_worker_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ prodqual_worker_profile_root }}"
      mode: "{{ prodqual_worker_profile_dir_mode }}"
    - path: "{{ prodqual_worker_scratch_root }}"
      mode: "{{ prodqual_worker_profile_dir_mode }}"
    - path: "{{ prodqual_worker_log_root }}"
      mode: "{{ prodqual_log_dir_mode }}"

- name: Validate authority path integrity
  when: not (ansible_check_mode | bool)
  become: true
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: prodqual_authority_path_stat
  changed_when: false
  loop:
    - path: "{{ prodqual_runtime_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_runtime_dir_mode }}"
    - path: "{{ prodqual_manifest_path | dirname }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_approval_dir_mode }}"
    - path: "{{ prodqual_taskstore_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_taskstore_dir_mode }}"
    - path: "{{ prodqual_approval_store }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_approval_dir_mode }}"
    - path: "{{ prodqual_backup_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_backup_dir_mode }}"
    - path: "{{ prodqual_authority_profile_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_authority_profile_dir_mode }}"
    - path: "{{ prodqual_authority_credential_ref_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_credential_ref_dir_mode }}"
    - path: "{{ prodqual_authority_launchd_dir }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_log_dir_mode }}"
    - path: "{{ prodqual_authority_log_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_log_dir_mode }}"
    - path: "{{ prodqual_rollback_staging_root }}"
      owner: "{{ prodqual_authority_user }}"
      group: "{{ prodqual_authority_group }}"
      mode: "{{ prodqual_backup_dir_mode }}"

- name: Assert authority path integrity
  when: not (ansible_check_mode | bool)
  become: true
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
      - (("0000" ~ (item.stat.mode | string | regex_replace('[^0-7]', '')))[-4:]) == (("0000" ~ (item.item.mode | string | regex_replace('[^0-7]', '')))[-4:])
    fail_msg: "authority path integrity failed closed for {{ item.item.path }}"
  loop: "{{ prodqual_authority_path_stat.results }}"
  changed_when: false

- name: Validate worker path integrity
  when: not (ansible_check_mode | bool)
  become: true
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  register: prodqual_worker_path_stat
  changed_when: false
  loop:
    - path: "{{ prodqual_worker_profile_root }}"
      owner: "{{ prodqual_worker_user }}"
      group: "{{ prodqual_worker_group }}"
      mode: "{{ prodqual_worker_profile_dir_mode }}"
    - path: "{{ prodqual_worker_scratch_root }}"
      owner: "{{ prodqual_worker_user }}"
      group: "{{ prodqual_worker_group }}"
      mode: "{{ prodqual_worker_profile_dir_mode }}"
    - path: "{{ prodqual_worker_log_root }}"
      owner: "{{ prodqual_worker_user }}"
      group: "{{ prodqual_worker_group }}"
      mode: "{{ prodqual_log_dir_mode }}"

- name: Assert worker path integrity
  when: not (ansible_check_mode | bool)
  become: true
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
      - (("0000" ~ (item.stat.mode | string | regex_replace('[^0-7]', '')))[-4:]) == (("0000" ~ (item.item.mode | string | regex_replace('[^0-7]', '')))[-4:])
    fail_msg: "worker path integrity failed closed for {{ item.item.path }}"
  loop: "{{ prodqual_worker_path_stat.results }}"
  changed_when: false

- name: Verify worker write is denied on authority paths
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ role_path }}/files/worker_write_probe.py"
      - "{{ prodqual_worker_uid | string }}"
      - "{{ prodqual_worker_gid | string }}"
      - "{{ item }}"
  register: prodqual_worker_denied
  failed_when: (prodqual_worker_denied.rc | prodqual_interpret_worker_probe(True) | length) > 0
  changed_when: false
  loop:
    - "{{ prodqual_runtime_root }}"
    - "{{ prodqual_manifest_path | dirname }}"
    - "{{ prodqual_taskstore_root }}"
    - "{{ prodqual_approval_store }}"
    - "{{ prodqual_backup_root }}"
    - "{{ prodqual_authority_profile_root }}"
    - "{{ prodqual_authority_credential_ref_root }}"
    - "{{ prodqual_authority_launchd_dir }}"
    - "{{ prodqual_authority_log_root }}"
    - "{{ prodqual_rollback_staging_root }}"

- name: Verify worker write is permitted on bounded worker paths
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - "{{ role_path }}/files/worker_write_probe.py"
      - "{{ prodqual_worker_uid | string }}"
      - "{{ prodqual_worker_gid | string }}"
      - "{{ item }}"
  register: prodqual_worker_allowed
  failed_when: (prodqual_worker_allowed.rc | prodqual_interpret_worker_probe(False) | length) > 0
  changed_when: false
  loop:
    - "{{ prodqual_worker_profile_root }}"
    - "{{ prodqual_worker_scratch_root }}"
    - "{{ prodqual_worker_log_root }}"

- name: Verify UserName/mode are not treated as the full boundary
  ansible.builtin.debug:
    msg: >-
      launchd UserName and file modes are necessary but not sufficient.
      Worker write probes above are the boundary evidence.
