---
# Defaults for macos_prodqual_loopback.
# No secrets. No physical hostname. No operator home. No numeric UniqueID pins.
# Apply-time UIDs are discovered; empty here fails closed unless a fixture supplies them.

prodqual_target_name: noesis-prodqual-macos-arm64-loopback-control-plane
prodqual_target_version: v1
prodqual_os_family: Darwin
prodqual_os_product: macOS
prodqual_os_major: "27"
prodqual_arch: arm64

prodqual_apply_authorized: false
prodqual_offline_mode: false
prodqual_restore_authorized: false
prodqual_restore_live_authorized: false
prodqual_backup_authorized: false
prodqual_rollback_authorized: false
prodqual_activation_authorized: false
prodqual_canary_authorized: false
prodqual_privilege_required: true
prodqual_uids_discovered: false
prodqual_tailscale_bind_enabled: false
prodqual_public_bind_enabled: false
prodqual_palace_enabled: false
prodqual_runtime_immutable: false

prodqual_authority_user: noesis-authority
prodqual_worker_user: noesis-worker
prodqual_authority_group: noesis-authority
prodqual_worker_group: noesis-worker
prodqual_authority_shell: /usr/bin/false
prodqual_worker_shell: /usr/bin/false
prodqual_authority_uid: null
prodqual_worker_uid: null
prodqual_worker_gid: null
prodqual_operator_uid: null
prodqual_operator_user: null

prodqual_path_prefix: /opt/noesis/prodqual
prodqual_runtime_root: /opt/noesis/prodqual/runtime
prodqual_manifest_path: /opt/noesis/prodqual/authority/approved-release-manifest.json
prodqual_taskstore_root: /opt/noesis/prodqual/authority/taskstore
prodqual_approval_store: /opt/noesis/prodqual/authority/approvals
prodqual_backup_root: /opt/noesis/prodqual/authority/backups
prodqual_authority_profile_root: /opt/noesis/prodqual/authority/profiles
prodqual_worker_profile_root: /opt/noesis/prodqual/worker/profiles
prodqual_worker_scratch_root: /opt/noesis/prodqual/worker/scratch
prodqual_authority_credential_ref_root: /opt/noesis/prodqual/authority/credential-refs
prodqual_authority_log_root: /opt/noesis/prodqual/authority/logs
prodqual_worker_log_root: /opt/noesis/prodqual/worker/logs
prodqual_authority_run_root: /opt/noesis/prodqual/authority/run
prodqual_authority_launchd_dir: /Library/LaunchDaemons
prodqual_worker_launchd_dir: /Library/LaunchDaemons
prodqual_rollback_staging_root: /opt/noesis/prodqual/authority/restore-staging

prodqual_runtime_owner: noesis-authority
prodqual_manifest_owner: noesis-authority
prodqual_worker_profile_owner: noesis-worker
prodqual_runtime_dir_mode: "0755"
prodqual_runtime_file_mode: "0644"
prodqual_manifest_mode: "0640"
prodqual_taskstore_dir_mode: "0700"
prodqual_taskstore_file_mode: "0600"
prodqual_approval_dir_mode: "0700"
prodqual_approval_file_mode: "0600"
prodqual_backup_dir_mode: "0700"
prodqual_credential_ref_dir_mode: "0700"
prodqual_authority_profile_dir_mode: "0700"
prodqual_worker_profile_dir_mode: "0700"
prodqual_log_dir_mode: "0700"
prodqual_launchd_plist_mode: "0644"
prodqual_launchd_plist_owner: root
prodqual_launchd_plist_group: wheel

prodqual_broker_bind_host: "127.0.0.1"
prodqual_broker_bind_port: 8787
prodqual_openclaw_bind_host: "127.0.0.1"
prodqual_openclaw_bind_port: 18789
# Frozen Hermes CLI (`gateway run`) has no unix-socket or bind-address flag.
# Trust boundary: launchd UserName/GroupName, WorkingDirectory, no Sockets
# dictionary, and --external-supervisor under an external process manager.
prodqual_hermes_gateway_bind_class: process_supervised_no_network_listener
prodqual_hermes_gateway_socket: ""
prodqual_hermes_gateway_argv:
  - gateway
  - run
  - --external-supervisor

prodqual_broker_python: /opt/noesis/prodqual/runtime/control-plane/python
prodqual_broker_app: app.main:app
prodqual_orchestrator_bin: /opt/noesis/prodqual/runtime/control-plane/supervisor.py
prodqual_orchestrator_interval: 60
prodqual_hermes_bin: /opt/noesis/prodqual/runtime/bin/hermes
prodqual_openclaw_bin: /opt/noesis/prodqual/runtime/bin/openclaw

prodqual_timeout_seconds: 1800
prodqual_exit_timeout_seconds: 20
prodqual_throttle_interval_seconds: 30
prodqual_max_parallel_jobs: 4
prodqual_max_fanout: 3
prodqual_max_cost_usd: "2.00"
prodqual_daily_supervisor_budget_usd: "10.00"
prodqual_daily_alert_usd: "8.00"
prodqual_per_job_hard_limit_usd: "5.00"
prodqual_block_reasoning_strong_without_approval: true
prodqual_sandbox_mode: true
prodqual_approval_mode: human-in-the-loop

prodqual_service_labels:
  - ai.noesis.broker
  - ai.noesis.orchestrator
  - ai.hermes.gateway
  - ai.openclaw.gateway

prodqual_stale_labels_refused:
  - com.noesis.hermesdev
  - com.noesis.clawdev

prodqual_governed_env_keys:
  - HERMES_GOVERNED_PRODUCTION
  - HERMES_APPROVED_RELEASE_MANIFEST
  - HERMES_NOESIS_AUTHORITY_UID
  - HERMES_NOESIS_WORKER_UID

prodqual_manifest_schema_version: noesis.approved_release_manifest/v1
prodqual_candidate_id: prodqual-hermes-adaptation-successor/v1
prodqual_runtime_payload_recipe_version: hardening-1-trusted-manifest-runtime/v2
# candidate_commit in the approved-release manifest is this adaptation successor,
# not the HARDENING grandparent 059c3b5b….
prodqual_hardening_candidate_commit: "d70372b6ce35c3a0f1243fda8d810c3e24c16940"
prodqual_hardening_pin_status: approved_with_comments_adaptation_sentinel_r2_skeptic_r1
prodqual_package_parent_commit: "ba6911a54787861f748a526fce7ff18926c7740d"
prodqual_runtime_payload_digest: "3314ff8e88e1433bc0d9bf2ba6cd08efb7be99132ee79a8d6eaea6a9c398eb01"
prodqual_ansible_baseline_commit: "ffb1357d07ccdde0036c82acb47073b9d6770037"
