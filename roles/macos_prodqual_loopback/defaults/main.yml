# Credential delivery is a later activation concern. References only; no values.
prodqual_authority_credential_refs:
  broker_token_env: HERMES_BROKER_TOKEN
  palace_token_env: HERMES_PALACE_TOKEN
  secret_store: bitwarden-sm
  secret_store_project_id_var: bitwarden_project_id

prodqual_phases:
  - offline_validation
  - install
  - activation
  - bounded_canary
  - rollback
